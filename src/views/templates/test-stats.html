<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Stats API</title>
    <style>
        body {
            font-family: monospace;
            padding: 20px;
            background: #f5f5f5;
        }
        .result {
            background: white;
            padding: 20px;
            border-radius: 8px;
            margin-top: 20px;
        }
        pre {
            background: #f0f0f0;
            padding: 10px;
            border-radius: 4px;
            overflow-x: auto;
        }
        .error {
            color: red;
        }
        .success {
            color: green;
        }
    </style>
</head>
<body>
    <h1>Testing /api/stats Endpoint</h1>
    <button onclick="testStats()">Fetch Stats</button>
    <div id="result" class="result"></div>

    <script>
        async function testStats() {
            const resultDiv = document.getElementById('result');
            resultDiv.innerHTML = '<p>Loading...</p>';

            try {
                console.log('Fetching /api/stats...');
                const response = await fetch('/api/stats');
                console.log('Response status:', response.status);
                console.log('Response ok:', response.ok);

                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }

                const stats = await response.json();
                console.log('Stats received:', stats);

                resultDiv.innerHTML = `
                    <p class="success">✅ Success!</p>
                    <h3>Stats Data:</h3>
                    <ul>
                        <li><strong>Total Fingerprints:</strong> ${stats.totalFingerprints}</li>
                        <li><strong>Unique Fingerprints:</strong> ${stats.uniqueFingerprints}</li>
                        <li><strong>Returning Users:</strong> ${stats.returningUsers}</li>
                        <li><strong>Average Sessions:</strong> ${stats.averageSessionsPerFingerprint}</li>
                        <li><strong>Recent Activity:</strong> ${stats.recentActivity}</li>
                    </ul>
                    <h3>Full Response:</h3>
                    <pre>${JSON.stringify(stats, null, 2)}</pre>
                `;
            } catch (error) {
                console.error('Error:', error);
                resultDiv.innerHTML = `
                    <p class="error">❌ Error: ${error.message}</p>
                    <pre>${error.stack}</pre>
                `;
            }
        }

        window.onload = () => {
            testStats();
        };
    </script>
</body>
</html>
